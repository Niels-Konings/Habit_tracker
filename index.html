    if(hab.type==='weekly_count'){ const c=weekCount(hab.id,wkStartKey),t=hab.weeklyTarget||1; tot=c+'/'+t; met=c>=t; }
    else if(hab.type==='quantitative'&&hab.period==='weekly'){ const s=weekSum(hab.id,wkStartKey),t=hab.target||0; tot=s+(t?('/'+t):''); met=t&&s>=t; }
    else { let dn=0,sc=0; days.forEach(dk=>{ const d=parseKey(dk); if(hab.type==='specific_days'&&!isScheduled(hab,d)) return; if(!isPastDay(dk)&&!isTodayKey(dk)) return; sc++; if(dayStatus(hab,dk)==='done') dn++; }); tot=sc?dn+'/'+sc:'-'; met = sc>0 && dn===sc; }
    tr.appendChild(h('td',{}, h('span',{class:'gtot'+(met?' met':'')}, tot)));
    table.appendChild(tr);
  });
  box.appendChild(table);
  wrap.appendChild(box);
  wrap.appendChild(h('div',{style:{fontSize:'12px',color:'var(--faint)',margin:'12px 2px 0',display:'flex',gap:'14px',flexWrap:'wrap'}},
    legendItem('done','Done',null), legendItem('partial','Partial',null), legendItem('missed','Missed',null), legendItem('pending','Pending',null)));
}
function legendItem(cls,label){ const c=h('div',{class:'gcell '+cls,style:{width:'18px',height:'18px'}});
  if(cls==='done'){ c.style.background='var(--accent)'; c.style.borderColor='var(--accent)'; c.style.color='#fff'; c.innerHTML=I.check; }
  else if(cls==='partial'){ c.appendChild(h('div',{class:'pd',style:{background:'var(--accent)'}})); }
  return h('span',{style:{display:'inline-flex',alignItems:'center',gap:'6px'}}, c, label); }
/* ---------------- Charts (inline SVG) ---------------- */
function svgLineChart(vals, labels, opts){
  opts=opts||{}; const n=vals.length; const w=320,ht=150,pl=28,pr=8,pt=10,pb=22;
  const pw=w-pl-pr, ph=ht-pt-pb; const max=opts.max!=null?opts.max:Math.max(1,...vals);
  const X=i=> n<=1?pl+pw/2 : pl+pw*(i/(n-1)); const Y=v=> pt+ph*(1-Math.max(0,Math.min(max,v))/max);
  let grid=''; const ticks=opts.pct?[0,50,100]:[0,max/2,max];
  ticks.forEach(t=>{ const y=Y(t); grid+=`<line class="axline" x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}"/><text class="axlbl" x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${opts.pct?Math.round(t)+'%':fmtNum(t)}</text>`; });
  let pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const col=opts.color||'#8b7cf6';
  let area=`M ${X(0).toFixed(1)} ${(pt+ph).toFixed(1)} `+vals.map((v,i)=>'L '+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')+` L ${X(n-1).toFixed(1)} ${(pt+ph).toFixed(1)} Z`;
  let dots=vals.map((v,i)=> v==null?'':`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="${col}"/>`).join('');
  let xl=''; const showIdx=n<=6?vals.map((_,i)=>i):[0,Math.floor((n-1)/2),n-1];
  showIdx.forEach(i=>{ xl+=`<text class="axlbl" x="${X(i).toFixed(1)}" y="${ht-6}" text-anchor="middle">${labels[i]||''}</text>`; });
  return `<svg viewBox="0 0 ${w} ${ht}">${grid}<path d="${area}" fill="${rgba(col,0.14)}"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}
function svgBarChart(vals, labels, opts){
  opts=opts||{}; const n=vals.length; const w=320,ht=150,pl=28,pr=8,pt=10,pb=22;
  const pw=w-pl-pr, ph=ht-pt-pb; const max=opts.max!=null?opts.max:Math.max(1,...vals);
  const col=opts.color||'#8b7cf6'; const bw=pw/n*0.62; const gap=pw/n;
  let grid=''; const ticks=opts.pct?[0,50,100]:[0,max];
  ticks.forEach(t=>{ const y=pt+ph*(1-t/max); grid+=`<line class="axline" x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}"/><text class="axlbl" x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end">${opts.pct?Math.round(t)+'%':fmtNum(t)}</text>`; });
  let bars=''; vals.forEach((v,i)=>{ const bh=ph*Math.max(0,Math.min(max,v))/max; const x=pl+gap*i+(gap-bw)/2; const y=pt+ph-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="3" fill="${opts.colorAt?opts.colorAt(i):col}"/>`;
    bars+=`<text class="axlbl" x="${(x+bw/2).toFixed(1)}" y="${ht-6}" text-anchor="middle">${labels[i]||''}</text>`; });
  return `<svg viewBox="0 0 ${w} ${ht}">${grid}${bars}</svg>`;
}
function fmtNum(n){ n=Math.round(n); if(n>=1000) return (n/1000).toFixed(n%1000?1:0)+'k'; return String(n); }

function weeklyCompletionSeries(nWeeks){
  const out=[]; const curWk=weekStart(effDate(NOW()));
  for(let i=nWeeks-1;i>=0;i--){
    const wkStart=addDays(curWk,-i*7); const wk=keyOf(wkStart); let done=0,total=0;
    activeHabits().concat(DB.habits.filter(hb=>hb.archived)).forEach(hab=>{
      const startTs=parseKey(habitStartKey(hab)).getTime(), endTs=parseKey(habitEndKey(hab)).getTime();
      const weekly=hab.type==='weekly_count'||(hab.type==='quantitative'&&hab.period==='weekly');
      if(weekly){ if(isPastWeek(wk) && parseKey(wk).getTime()>=weekStart(new Date(startTs)).getTime() && parseKey(wk).getTime()<=endTs){ total++; if(weekMet(hab,wk)) done++; } return; }
      for(let dI=0;dI<7;dI++){ const d=addDays(wkStart,dI); const dk=keyOf(d);
        if(d.getTime()<startTs||d.getTime()>endTs) continue;
        if(!isPastDay(dk)) continue;
        if(hab.type==='specific_days'&&!isScheduled(hab,d)) continue;
        total++; if(dayStatus(hab,dk)==='done') done++; }
    });
    out.push({ v: total?Math.round(done/total*100):null, label:(wkStart.getMonth()+1)+'/'+wkStart.getDate() });
  }
  // convert null (no data) to 0-ish but keep line continuous: replace nulls with previous or 0
  return out;
}
function bestDays(){
  const done=[0,0,0,0,0,0,0], tot=[0,0,0,0,0,0,0];
  activeHabits().concat(DB.habits.filter(hb=>hb.archived)).forEach(hab=>{
    if(hab.type==='weekly_count'||(hab.type==='quantitative'&&hab.period==='weekly')) return;
    let cur=parseKey(habitStartKey(hab)); const end=parseKey(habitEndKey(hab));
    while(cur.getTime()<=end.getTime()){ const dk=keyOf(cur);
      if(isPastDay(dk) && isScheduled(hab,cur)){ const wd=cur.getDay(); tot[wd]++; if(dayStatus(hab,dk)==='done') done[wd]++; }
      cur=addDays(cur,1); }
  });
  // Monday-first
  const order=[1,2,3,4,5,6,0];
  return order.map(wd=> ({ v: tot[wd]?Math.round(done[wd]/tot[wd]*100):0, label:WD_LET[wd], has:tot[wd]>0 }) );
}
function totalCheckoffs(){
  let n=0; DB.habits.forEach(hab=>{ const l=DB.logs[hab.id]; if(!l) return;
    for(const k in l){ const e=l[k];
      if(hab.type==='quantitative'){ if(e.a>0) n++; }
      else if(hab.type==='weekly_count'){ if(e.d) n++; }
      else { if(simpleDone(hab,e)) n++; } } });
  return n;
}

function renderStats(wrap){
  const act=activeHabits();
  if(DB.habits.length===0){ wrap.appendChild(h('div',{class:'empty'}, h('div',{class:'big'},'📊'), h('h2',{},'No stats yet'), h('p',{},'Create habits and start logging to see trends here.'))); return; }
  // tiles
  let doneToday=0,sched=0; act.forEach(hab=>{ const d=parseKey(todayKey()); if(hab.type==='specific_days'&&!isScheduled(hab,d)) return; sched++; if(dayStatus(hab,todayKey())==='done') doneToday++; });
  let maxStreak=0; act.forEach(hab=>{ maxStreak=Math.max(maxStreak,currentStreak(hab)); });
  const tiles=h('div',{class:'tiles'},
    tile(String(act.length),'Active habits'),
    tile(doneToday+'/'+sched,'Done today'),
    tile(String(maxStreak),'Best current streak'),
    tile(String(totalCheckoffs()),'Total check-offs'));
  wrap.appendChild(tiles);

  // completion over time
  const series=weeklyCompletionSeries(12);
  const hasData=series.some(s=>s.v!=null);
  const svals=series.map(s=>s.v==null?0:s.v);
  const cpanel=h('div',{class:'panel'}, h('h3',{},'Completion over time'), h('p',{class:'cap'},'Weekly completion across all habits, last 12 weeks'));
  if(hasData) cpanel.appendChild(h('div',{class:'chartbox',html:svgLineChart(svals, series.map(s=>s.label), {pct:true,max:100,color:'#8b7cf6'})}));
  else cpanel.appendChild(h('div',{class:'emptymini'},'Not enough history yet.'));
  wrap.appendChild(cpanel);

  // per-habit completion
  const ppanel=h('div',{class:'panel'}, h('h3',{},'Per-habit completion'), h('p',{class:'cap'},'All-time, excluding pending days'));
  if(act.length===0) ppanel.appendChild(h('div',{class:'emptymini'},'No active habits.'));
  act.forEach(hab=>{ const c=completion(hab); const pct=c.rate==null?0:Math.round(c.rate*100);
    const bar=h('div',{class:'hbar'},
      h('span',{class:'hbi',style:{background:rgba(hab.color,0.16),color:hab.color}},hab.icon||'⭐'),
      h('span',{class:'hbn'},hab.name),
      h('span',{class:'track'}, (()=>{ const f=h('span',{class:'f'}); f.style.width=pct+'%'; f.style.background=hab.color; return f; })()),
      h('span',{class:'pct'}, c.rate==null?'-':pct+'%'));
    ppanel.appendChild(bar); });
  wrap.appendChild(ppanel);

  // best days
  const bd=bestDays(); const anyBd=bd.some(x=>x.has);
  const bpanel=h('div',{class:'panel'}, h('h3',{},'Best days'), h('p',{class:'cap'},'Completion rate by weekday'));
  if(anyBd){ const maxV=Math.max(1,...bd.map(x=>x.v)); bpanel.appendChild(h('div',{class:'chartbox',html:svgBarChart(bd.map(x=>x.v), bd.map(x=>x.label), {pct:true,max:100,colorAt:i=> bd[i].v>=maxV&&maxV>0?'#37c871':'#8b7cf6'})})); }
  else bpanel.appendChild(h('div',{class:'emptymini'},'Not enough history yet.'));
  wrap.appendChild(bpanel);

  // quantitative totals
  const quants=act.filter(hb=>hb.type==='quantitative');
  quants.forEach(hab=>{
    const curWk=weekStart(effDate(NOW())); const vals=[],labels=[];
    for(let i=7;i>=0;i--){ const wkS=addDays(curWk,-i*7); const wk=keyOf(wkS); vals.push(weekSum(hab.id,wk)); labels.push((wkS.getMonth()+1)+'/'+wkS.getDate()); }
    const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    const qp=h('div',{class:'panel'}, h('h3',{},hab.name+' - weekly total'), h('p',{class:'cap'},'Last 8 weeks · avg '+avg+' '+(hab.unit||'')+'/wk'));
    if(vals.some(v=>v>0)) qp.appendChild(h('div',{class:'chartbox',html:svgBarChart(vals, labels, {color:hab.color, max: Math.max(hab.target||0, ...vals)})}));
    else qp.appendChild(h('div',{class:'emptymini'},'No data logged yet.'));
    wrap.appendChild(qp);
  });
}

function field(label,control){ const f=h('div',{class:'field'}, h('label',{},label)); f.appendChild(control); return f; }
function stepper(val,min,max,cb){ const wrap=h('div',{class:'stepper'});

  wrap.appendChild(h('button',{'aria-label':'Decrease',onclick:()=>{ val=Math.max(min,val-1); valEl.textContent=val; cb(val); }}, icon('minus')));

  wrap.appendChild(h('button',{'aria-label':'Increase',onclick:()=>{ val=Math.min(max,val+1); valEl.textContent=val; cb(val); }}, icon('plus')));

function radopt(on,title,desc,cb){ return h('div',{class:'radopt'+(on?' on':''),onclick:cb}, h('div',{class:'rk'}), h('div',{}, h('div',{class:'rt'},title), h('div',{class:'rd'},desc))); }
function normHex(c){ if(/^#([0-9a-f]{6})$/i.test(c)) return c; if(/^#([0-9a-f]{3})$/i.test(c)){ const h=c.slice(1); return '#'+h.split('').map(x=>x+x).join(''); } return '#8b7cf6'; }

function saveHabit(draft,editing){
  draft.name=(draft.name||'').trim();
  if(!draft.name){ showToast('Please enter a name'); return; }
  if(draft.type==='specific_days' && (!draft.days||draft.days.length===0)){ showToast('Pick at least one day'); return; }
  if(draft.type==='weekly_count') draft.weeklyTarget=Math.max(1,parseInt(draft.weeklyTarget)||1);
  if(draft.type==='quantitative'){ draft.target=Math.max(0,parseFloat(draft.target)||0); draft.unit=(draft.unit||'').trim(); }
  if(draft.type==='daily'||draft.type==='specific_days'){ draft.subgoals=(draft.subgoals||[]).filter(s=>(s.name||'').trim()).map(s=>({id:s.id,name:s.name.trim()})); }
  else draft.subgoals=[];
  if(editing){ const idx=DB.habits.findIndex(x=>x.id===draft.id); if(idx>=0) DB.habits[idx]=Object.assign(DB.habits[idx],draft); }
  else { DB.habits.push(draft); }
  save(); diag((editing?'Edited':'Created')+' habit '+draft.name);
  closeModal();
}
function toggleArchive(id){ const hb=getHabit(id); if(!hb) return; hb.archived=!hb.archived; hb.archivedAt=hb.archived?NOW():null; save(); diag((hb.archived?'Archived':'Unarchived')+' '+hb.name); }
function deleteHabit(id){ const hb=getHabit(id); DB.habits=DB.habits.filter(x=>x.id!==id); delete DB.logs[id]; if(state.detail===id) state.detail=null; if(state.heatSel===id) state.heatSel='overall'; save(); diag('Deleted '+(hb?hb.name:id)); }
/* ============================ day editor ============================ */
function openDayEditor(dk, habitId){
  openSheet(habitId?'detailday':'dayeditor', (api)=>{
    clearEl(api.head); clearEl(api.body); clearEl(api.foot);
    api.head.appendChild(h('h2',{}, relLabel(dk)+' · '+fmtDate(dk)));
    api.head.appendChild(h('button',{class:'iconbtn','aria-label':'Close',onclick:closeModal}, icon('close')));
    const B=api.body;
    let list;
    if(habitId){ const hb=getHabit(habitId); list=hb?[hb]:[]; }
    else list=activeHabits().filter(hab=> !(hab.type==='specific_days' && !isScheduled(hab,parseKey(dk)) && hab.offDay==='hide'));
    if(list.length===0){ B.appendChild(h('div',{class:'emptymini',style:{padding:'20px 0'}},'Nothing to log on this day.')); }
    list.forEach(hab=>{
      const scheduled=isScheduled(hab,parseKey(dk));
      const bonus = hab.type==='specific_days' && !scheduled;
      const panel=h('div',{class:'det-panel',style:{marginTop:'10px'}});
      const iact=buildInteractive(hab,dk,'editor');
      const head=h('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:iact.extra?'8px':'0'}},
        h('span',{class:'chip',style:{width:'40px',height:'40px',fontSize:'20px',background:rgba(hab.color,0.16),color:hab.color}},hab.icon||'⭐'),
        h('div',{style:{flex:'1',minWidth:0}}, h('div',{style:{fontWeight:'700'}},hab.name), h('div',{style:{fontSize:'12px',color:'var(--dim)'}}, bonus?'Bonus (off day)':statusWord(dayStatus(hab,dk),bonus))),
        iact.primary);
      panel.appendChild(head);
      if(iact.extra) panel.appendChild(iact.extra);
      B.appendChild(panel);
    });
    api.foot.appendChild(h('button',{class:'btn primary',onclick:closeModal},'Done'));
  });
}

/* ============================ settings ============================ */
let deferredPrompt=null;
function openSettings(){
  let confirmReset=false, confirmImport=null;
  openSheet('settings',(api)=>{
    clearEl(api.head); clearEl(api.body); clearEl(api.foot);
    api.head.appendChild(h('h2',{},'Settings'));
    api.head.appendChild(h('button',{class:'iconbtn','aria-label':'Close',onclick:closeModal}, icon('close')));
    const B=api.body;

    // appearance
    B.appendChild(h('div',{class:'sec-h',style:{marginTop:'8px'}},'Appearance'));
    const themeSeg=h('div',{class:'seg'});
    [['dark','Dark'],['light','Light']].forEach(([v,l])=> themeSeg.appendChild(h('button',{class:DB.settings.theme===v?'on':'',onclick:()=>{ setTheme(v); api.rebuild(); }},l)) );
    B.appendChild(themeSeg);

    // data
    B.appendChild(h('div',{class:'sec-h'},'Backup and restore'));
    B.appendChild(h('div',{class:'srow'}, h('div',{class:'st'}, h('div',{class:'t'},'Export data'), h('div',{class:'d'},'Download a JSON backup of all habits and history.')),
      h('button',{class:'ab',onclick:exportData}, 'Export')));
    const fileInp=h('input',{type:'file',accept:'application/json,.json',style:{display:'none'},onchange:e=>{ const f=e.target.files[0]; if(f) importFile(f,(res)=>{ confirmImport=res; api.rebuild(); }); e.target.value=''; }});
    B.appendChild(h('div',{class:'srow'}, h('div',{class:'st'}, h('div',{class:'t'},'Import data'), h('div',{class:'d'},'Restore from a backup. This replaces all current data.')),
      h('button',{class:'ab',onclick:()=>fileInp.click()}, 'Import'), fileInp));
    if(confirmImport){
      B.appendChild(h('div',{class:'warn'}, h('span',{}, 'Replace all current data with the backup? '+confirmImport.count+' habits found. This cannot be undone.'),
        h('div',{class:'wbtns'}, h('button',{onclick:()=>{ confirmImport=null; api.rebuild(); }},'Cancel'),
          h('button',{class:'solid',onclick:()=>{ applyImport(confirmImport.data); confirmImport=null; closeModal(); }},'Replace'))));
    }

    // storage
    B.appendChild(h('div',{class:'sec-h'},'Storage'));
    const pg=state.persistGranted;
    B.appendChild(h('div',{class:'srow'}, h('div',{class:'st'}, h('div',{class:'t'},'Persistent storage'), h('div',{class:'d'}, pg===true?'Granted. Your data will not be evicted automatically.':pg===false?'Not granted. Browser may clear data under storage pressure.':'Unknown')),
      pg===true? h('span',{class:'badge ok'},'On') : h('button',{class:'ab',onclick:async()=>{ await requestPersist(true); api.rebuild(); }}, 'Request')));
    if(state.estimate){ const u=(state.estimate.usage/1048576), q=(state.estimate.quota/1048576);
      B.appendChild(h('div',{class:'srow'}, h('div',{class:'st'}, h('div',{class:'t'},'Space used'), h('div',{class:'d'}, u.toFixed(2)+' MB of ~'+ (q>1024?(q/1024).toFixed(1)+' GB':q.toFixed(0)+' MB')))));
    }
    if(saveErr) B.appendChild(h('div',{class:'warn'}, h('span',{},'The last save failed. Storage may be full. Export a backup to be safe.')));

    // archived
    const arch=DB.habits.filter(hb=>hb.archived);
    if(arch.length){
      B.appendChild(h('div',{class:'sec-h'},'Archived habits'));
      arch.forEach(hab=>{ B.appendChild(h('div',{class:'arch-item'},
        h('span',{class:'ai',style:{background:rgba(hab.color,0.16),color:hab.color}},hab.icon||'⭐'),
        h('span',{class:'an'},hab.name),
        h('button',{class:'ab',onclick:()=>{ toggleArchive(hab.id); api.rebuild(); }},'Unarchive'),
        h('button',{class:'ab danger',onclick:()=>{ if(confirm('Delete '+hab.name+' and all its history?')){ deleteHabit(hab.id); api.rebuild(); } }},'Delete'))); });
    }

    // diagnostics
    B.appendChild(h('div',{class:'sec-h'},'Diagnostics'));
    B.appendChild(h('div',{class:'srow'}, h('div',{class:'st'}, h('div',{class:'t'},'Habits'), h('div',{class:'d'}, DB.habits.length+' total · '+activeHabits().length+' active'))));
    const diagBox=h('div',{class:'diag'}, (DB.diag&&DB.diag.length)?DB.diag.join('\n'):'No diagnostic messages.');
    B.appendChild(diagBox);
    B.appendChild(h('div',{style:{marginTop:'10px'}}, h('button',{class:'btn danger',onclick:()=>{ confirmReset=true; api.rebuild(); }},'Reset all data')));
    if(confirmReset){
      B.appendChild(h('div',{class:'warn'}, h('span',{},'Erase ALL habits and history from this device? Export a backup first if unsure.'),
        h('div',{class:'wbtns'}, h('button',{onclick:()=>{ confirmReset=false; api.rebuild(); }},'Cancel'),
          h('button',{class:'solid',onclick:()=>{ resetAll(); closeModal(); }},'Erase everything'))));
    }

    // install / about
    B.appendChild(h('div',{class:'sec-h'},'Install'));
    if(deferredPrompt){ B.appendChild(h('div',{class:'srow'}, h('div',{class:'st'}, h('div',{class:'t'},'Install app'), h('div',{class:'d'},'Add to your home screen for full-screen, offline use.')),
      h('button',{class:'ab',onclick:async()=>{ const p=deferredPrompt; deferredPrompt=null; api.rebuild(); p.prompt(); try{ await p.userChoice; }catch(e){} }},'Install'))); }
    if(isIOS()){ B.appendChild(h('div',{style:{fontSize:'13px',color:'var(--dim)',lineHeight:'1.6'}},
      h('b',{},'iPhone / iPad: '),'Open in Safari, tap the Share button, then "Add to Home Screen".')); }
    B.appendChild(h('div',{class:'version'},'Habits v'+APP_VERSION));

    api.foot.appendChild(h('button',{class:'btn primary',onclick:closeModal},'Done'));
  });
}
function setTheme(t){ DB.settings.theme=t; applyTheme(); save(); }
function applyTheme(){ const t=DB.settings.theme||'dark'; document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  const meta=$('#theme-color-meta'); const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); if(meta&&bg) meta.setAttribute('content',bg); }

function exportData(){ try{
  const data=JSON.stringify(DB,null,2); const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=h('a',{href:url,download:'habits-backup-'+todayKey()+'.json'}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  diag('Exported backup'); showToast('Backup downloaded');
}catch(e){ diag('Export failed: '+e.message); showToast('Export failed'); } }
function importFile(file,cb){ const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(!data||!Array.isArray(data.habits)) { showToast('Not a valid backup file'); return; }
    cb({data, count:data.habits.length});
  }catch(e){ showToast('Could not read file: '+e.message); } };
  r.onerror=()=>showToast('Could not read file'); r.readAsText(file); }
function applyImport(data){ try{
  DB=Object.assign(freshDB(), data); DB.settings=Object.assign({theme:'dark'},data.settings||{});
  if(!Array.isArray(DB.diag)) DB.diag=[]; if(!DB.logs) DB.logs={};
  DB.habits.forEach((h,i)=>{ if(h.order==null) h.order=i; if(!h.subgoals) h.subgoals=[]; });
  state.detail=null; state.heatSel='overall'; state.expanded.clear(); state.selectedKey=todayKey();
  applyTheme(); save(); diag('Imported backup ('+DB.habits.length+' habits)'); showToast('Data restored'); refresh();
}catch(e){ diag('Import failed: '+e.message); showToast('Import failed'); } }
function resetAll(){ DB=freshDB(); state.detail=null; state.heatSel='overall'; state.expanded.clear(); state.selectedKey=todayKey(); state.weekOffset=0; save(); diag('All data reset'); showToast('All data erased'); refresh(); }

async function requestPersist(force){ try{
  if(navigator.storage && navigator.storage.persist){
    let granted = await navigator.storage.persisted();
    if(!granted && (force || true)) granted = await navigator.storage.persist();
    state.persistGranted=granted; diag('Persistent storage: '+granted);
  } else state.persistGranted=null;
  if(navigator.storage && navigator.storage.estimate){ state.estimate=await navigator.storage.estimate(); }
}catch(e){ diag('Persist check failed: '+e.message); } }
function isIOS(){ return /iP(ad|hone|od)/.test(navigator.platform) || (/Mac/.test(navigator.platform)&&navigator.maxTouchPoints>1) || /iPhone|iPad|iPod/i.test(navigator.userAgent); }
/* ============================ navigation + history ============================ */
function pushHistory(){ history.pushState({hf:Date.now()}, ''); }
function openDetail(id){ if(state.modalOpen) return; state.detail=id; pushHistory(); renderDetail(); renderTopbar(); }
function closeDetail(){ history.back(); }
function closeModal(){ history.back(); }
function switchTab(t){
  if(state.modalOpen||state.detail) return;
  if(t===state.tab){ const s=$('#screen'); if(s.scrollTo) s.scrollTo({top:0,behavior:'smooth'}); else s.scrollTop=0; return; }
  if(t!=='today' && state.tab==='today'){ state.tab=t; pushHistory(); refresh(); }
  else if(t!=='today'){ state.tab=t; refresh(); }
  else { history.back(); }
}
addEventListener('popstate', ()=>{
  if(state.modalOpen){ state.modalOpen=false; state.modalName=null; hideModal(); refresh(); return; }
  if(state.detail){ state.detail=null; refresh(); return; }
  if(state.tab!=='today'){ state.tab='today'; refresh(); return; }
  /* at home base: nothing to pop, OS will minimise */
});

/* ============================ swipe (change day) ============================ */
function attachSwipe(el, guard){
  let sx=0,sy=0,active=false,decided=false,horiz=false;
  el.addEventListener('touchstart', e=>{
    if(!guard()||state.reordering) { active=false; return; }
    const t=e.target;
    if(t.closest && (t.closest('[data-handle]')||t.closest('input,textarea,select'))) { active=false; return; }
    const tp=e.touches[0]; sx=tp.clientX; sy=tp.clientY; active=true; decided=false; horiz=false;
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(!active) return; const tp=e.touches[0]; const dx=tp.clientX-sx, dy=tp.clientY-sy;
    if(!decided && (Math.abs(dx)>10||Math.abs(dy)>10)){ decided=true; horiz=Math.abs(dx) > Math.abs(dy)*1.3; }
  }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(!active) return; active=false; if(!decided||!horiz) return;
    const tp=e.changedTouches&&e.changedTouches[0]; if(!tp) return;
    const dx=tp.clientX-sx, dy=tp.clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dy)<55){ if(dx<0) changeDay(1); else changeDay(-1); }
  }, {passive:true});
}

/* ============================ drag to reorder (today) ============================ */
let drag=null;
function onHandleDown(e){
  const handle = e.target.closest && e.target.closest('[data-handle]');
  if(!handle) return;
  if(state.tab!=='today'||state.detail||state.modalOpen) return;
  const card=handle.closest('[data-card]'); if(!card) return;
  e.preventDefault();
  state.reordering=true;
  drag={ card, list:card.parentNode, startY:e.clientY, pointerId:e.pointerId, h:card.getBoundingClientRect().height };
  card.classList.add('dragging'); card.style.position='relative'; card.style.zIndex='1000';
  try{ card.setPointerCapture(e.pointerId); }catch(_){}
  addEventListener('pointermove', onHandleMove);
  addEventListener('pointerup', onHandleUp);
  addEventListener('pointercancel', onHandleUp);
}
function onHandleMove(e){
  if(!drag) return; e.preventDefault();
  drag.card.style.transform='translateY('+(e.clientY-drag.startY)+'px)';
  const rectC=drag.card.getBoundingClientRect(); const midC=rectC.top+rectC.height/2;
  const arr=Array.from(drag.list.children).filter(c=>c.hasAttribute('data-card'));
  const i=arr.indexOf(drag.card);
  const nxt=arr[i+1];
  if(nxt){ const r=nxt.getBoundingClientRect(); if(midC > r.top+r.height/2){ drag.list.insertBefore(nxt, drag.card); drag.startY += r.height; drag.card.style.transform='translateY('+(e.clientY-drag.startY)+'px)'; return; } }
  const prv=arr[i-1];
  if(prv){ const r=prv.getBoundingClientRect(); if(midC < r.top+r.height/2){ drag.list.insertBefore(drag.card, prv); drag.startY -= r.height; drag.card.style.transform='translateY('+(e.clientY-drag.startY)+'px)'; return; } }
}
function onHandleUp(){
  if(!drag) return;
  const list=drag.list, card=drag.card;
  card.style.transform=''; card.style.zIndex=''; card.style.position=''; card.classList.remove('dragging');
  try{ card.releasePointerCapture(drag.pointerId); }catch(_){}
  removeEventListener('pointermove', onHandleMove); removeEventListener('pointerup', onHandleUp); removeEventListener('pointercancel', onHandleUp);
  const ids=Array.from(list.children).filter(c=>c.hasAttribute('data-card')).map(c=>c.getAttribute('data-card'));
  ids.forEach((id,idx)=>{ const hb=getHabit(id); if(hb) hb.order=idx; });
  save(); vibrate(8);
  drag=null; state.reordering=false;
  renderTab();
}

/* ============================ keyboard (desktop aid) ============================ */
addEventListener('keydown', e=>{
  if(state.modalOpen) return;
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(state.tab==='today' || state.detail){
    if(e.key==='ArrowLeft'){ changeDay(-1); } else if(e.key==='ArrowRight'){ changeDay(1); }
  }
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(!state.modalOpen) refresh(); } });

/* ============================ PWA ============================ */
addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; });
addEventListener('appinstalled', ()=>{ deferredPrompt=null; diag('App installed'); });
if('serviceWorker' in navigator){ addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(e=>diag('SW register failed: '+e.message)); }); }

/* ============================ init ============================ */
function init(){
  load(); applyTheme(); sizeCanvas();
  history.replaceState({hf:'base'}, '');
  attachSwipe($('#screen'), ()=> state.tab==='today' && !state.detail && !state.modalOpen);
  attachSwipe($('#detail-root'), ()=> !!state.detail && !state.modalOpen);
  $('#screen').addEventListener('pointerdown', onHandleDown);
  refresh();
  requestPersist(false).then(()=>{ if(state.modalOpen && state.modalName==='settings' && modalRender) modalRender(); });
  window.__HF={ db:()=>DB, state, ver:APP_VERSION };
}
init();
</script>
